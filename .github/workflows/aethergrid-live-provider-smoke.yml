name: ÆTHERGRID Live Provider Smoke Acceptance

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Selected provider or all-safe for smoke check'
        required: false
        default: 'all-safe'
        type: choice
        options:
          - all-safe
          - groq
          - tomorrow
          - nws
          - nwps
          - eia
          - transitland
          - gtfs
          - ibm
          - dwave

jobs:
  smoke:
    name: Live Provider Smoke Acceptance Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Execute Live Provider Smoke Suite
        run: node scripts/live-provider-smoke.mjs --provider=${{ github.event.inputs.provider || 'all-safe' }}
        env:
          AETHERGRID_OPENAI_API_KEY: ${{ secrets.AETHERGRID_OPENAI_API_KEY }}
          AETHERGRID_TOMORROW_IO_API_KEY: ${{ secrets.AETHERGRID_TOMORROW_IO_API_KEY }}
          AETHERGRID_EIA_API_KEY: ${{ secrets.AETHERGRID_EIA_API_KEY }}
          AETHERGRID_TRANSIT_API_KEY: ${{ secrets.AETHERGRID_TRANSIT_API_KEY }}
          AETHERGRID_IBM_QUANTUM_API_KEY: ${{ secrets.AETHERGRID_IBM_QUANTUM_API_KEY }}
          AETHERGRID_IBM_QUANTUM_SERVICE_CRN: ${{ secrets.AETHERGRID_IBM_QUANTUM_SERVICE_CRN }}
          AETHERGRID_DWAVE_API_TOKEN: ${{ secrets.AETHERGRID_DWAVE_API_TOKEN }}
          AETHERGRID_CESIUM_ION_TOKEN: ${{ secrets.AETHERGRID_CESIUM_ION_TOKEN }}

      - name: Upload Sanitized Smoke Acceptance Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-provider-acceptance-report
          path: dist/live-provider-smoke-report.json
