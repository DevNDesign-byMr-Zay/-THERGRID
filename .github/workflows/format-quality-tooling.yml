name: branch/format-quality-tooling

on:
  push:
    branches:
      - chore/quality-tooling

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/quality-tooling
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply pinned Prettier
        run: npx --yes --package prettier@3.6.2 prettier --write 'src/**/*.mjs' 'tests/**/*.mjs' 'scripts/**/*.mjs'
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts
          git commit -m "style: apply maintained JavaScript formatting"
          git push origin HEAD:chore/quality-tooling
