name: engineering/ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Reproducible install
        run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
      - name: Verify release-readiness contract
        run: npm run verify:release
      - name: Smoke-test release manifest generation
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v$(node -p "require('./package.json').version")"
          node scripts/create-release-manifest.mjs "$release_tag" "$GITHUB_SHA" "$RUNNER_TEMP/release-manifest.json"
          test -s "$RUNNER_TEMP/release-manifest.json"

      - name: Syntax check
        run: npm run syntax
      - name: Lint maintained JavaScript
        run: npm run lint
      - name: Type-check maintained JavaScript
        run: npm run typecheck
      - name: Check formatting
        run: npm run format:check
      - name: Run conventional test suite
        run: npm test
      - name: Tests with coverage
        env:
          NODE_V8_COVERAGE: coverage/v8
        run: npm run coverage
      - name: Retain runtime coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: runtime-v8-coverage-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: coverage/v8/
      - name: Reproducible evidence and dashboard demos
        run: |
          npm run demo
          npm run dashboard-demo
      - name: Validate canonical container configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Smoke-test container runtime
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSE_FILE=docker-compose.yml
          trap 'docker compose down --volumes --remove-orphans' EXIT
          docker compose up --build --detach health

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker compose logs health
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/status
          docker compose ps
