name: engineering/ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run maintained typecheck
        run: npm run typecheck
      - name: Run strict renderer typecheck
        run: npm run typecheck:strict-renderer

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run lint
        run: npm run lint
      - name: Check formatting
        shell: bash
        run: |
          set -euo pipefail
          if npm run format:check; then
            exit 0
          fi
          npm run format >/dev/null
          echo "::group::Required Prettier changes"
          git --no-pager diff -- src tests scripts apps
          echo "::endgroup::"
          exit 1

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run conventional tests
        run: npm test

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run blocking coverage gate
        env:
          NODE_V8_COVERAGE: coverage/v8
        run: npm run coverage

  fresh-clone-smoke:
    name: fresh-clone-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout without prior build state
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Node without dependency cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prove clean locked install and full maintained verification
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules coverage
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm run check
      - name: Build application container without cached layers
        run: docker compose -f docker-compose.yml build --no-cache
      - name: Start clean application service and probe health
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSE_FILE=docker-compose.yml
          docker compose up --detach health
          trap 'docker compose down --volumes --remove-orphans' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker compose logs health
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/status

  container-smoke:
    name: container-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate canonical Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Build and smoke-test application container
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSE_FILE=docker-compose.yml
          docker compose up --build --detach health
          trap 'docker compose down --volumes --remove-orphans' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker compose logs health
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/status

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Reproducible install
        run: npm ci --ignore-scripts
      - name: Dependency security audit
        run: npm audit --audit-level=moderate
      - name: Verify release-readiness contract
        run: npm run verify:release
      - name: Build verified ÆTHERGRID UI archive
        run: npm run package:aethergrid
      - name: Retain verified ÆTHERGRID UI archive
        uses: actions/upload-artifact@v7
        with:
          name: aethergrid-ui-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: dist/aethergrid-operator-console.zip
      - name: Smoke-test release manifest generation
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v$(node -p "require('./package.json').version")"
          node scripts/create-release-manifest.mjs "$release_tag" "$GITHUB_SHA" "$RUNNER_TEMP/release-manifest.json"
          test -s "$RUNNER_TEMP/release-manifest.json"

      - name: Syntax check
        run: npm run syntax
      - name: Lint maintained JavaScript
        run: npm run lint
      - name: Type-check maintained JavaScript
        run: npm run typecheck
      - name: Strictly type-check renderer evidence safety boundary
        run: npm run typecheck:strict-renderer
      - name: Check formatting
        run: npm run format:check
      - name: Run conventional test suite
        run: npm test
      - name: Tests with coverage
        env:
          NODE_V8_COVERAGE: coverage/v8
        run: npm run coverage
      - name: Retain runtime coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: runtime-v8-coverage-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: coverage/v8/
      - name: Reproducible evidence and dashboard demos
        run: |
          npm run demo
          npm run dashboard-demo
      - name: Validate canonical container configuration
        run: docker compose -f docker-compose.yml config --quiet
      - name: Smoke-test container runtime
        shell: bash
        run: |
          set -euo pipefail
          export COMPOSE_FILE=docker-compose.yml
          trap 'docker compose down --volumes --remove-orphans' EXIT
          docker compose up --build --detach health

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            docker compose logs health
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:8080/health
          curl --fail --silent http://127.0.0.1:8080/status
          docker compose ps
