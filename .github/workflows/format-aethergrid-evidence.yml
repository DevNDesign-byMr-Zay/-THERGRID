name: recovery/aethergrid-evidence-format

on:
  push:
    branches:
      - feat/aethergrid-evidence-driven-ui

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out evidence UI branch
        uses: actions/checkout@v7
        with:
          ref: feat/aethergrid-evidence-driven-ui
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply repository Prettier
        run: npm run format
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests scripts apps README.md docs CHANGELOG.md
          git commit -m "style: format evidence-driven ÆTHERGRID UI"
          git push origin "HEAD:feat/aethergrid-evidence-driven-ui"
