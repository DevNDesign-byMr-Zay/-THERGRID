name: Open Quantum read-only discovery

on:
  workflow_dispatch:
  # Explicitly scoped one-shot acceptance on this integration branch.
  # Only this workflow file change triggers the secret-backed read-only check.
  push:
    branches:
      - feat/openquantum-readonly-discovery
    paths:
      - .github/workflows/openquantum-readonly.yml

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional Open Quantum SDK
        run: python -m pip install -r apps/aethergrid-console/requirements-openquantum.txt
      - name: Authenticate and discover backends (no jobs or credit spending)
        env:
          # These GitHub secrets contain JSON, not a local filesystem path.
          AETHERGRID_OPENQUANTUM_SDK_KEY_JSON: ${{ secrets.AETHERGRID_OPENQUANTUM_SDK_KEY_JSON || secrets.OPENQUANTUM_SDK_KEY_JSON || secrets.OPENQUANTUM_SDK_KEY || secrets.OPEN_QUANTUM }}
          OPENQUANTUM_CLIENT_ID: ${{ secrets.OPENQUANTUM_CLIENT_ID }}
          OPENQUANTUM_CLIENT_SECRET: ${{ secrets.OPENQUANTUM_CLIENT_SECRET }}
        run: |
          node --input-type=module <<'JS'
          const value = (process.env.AETHERGRID_OPENQUANTUM_SDK_KEY_JSON || '').trim();
          let parsed;
          try { parsed = JSON.parse(value); } catch {}
          const format = !value ? 'missing' :
            Array.isArray(parsed) ? 'json-array' :
            parsed && typeof parsed === 'object' ?
              ('client_id' in parsed && 'client_secret' in parsed ? 'sdk-json' :
               'clientId' in parsed && 'clientSecret' in parsed ? 'camel-case-json' : 'other-json-object') :
            typeof parsed === 'string' ? 'json-string' :
            /^(?:Bearer )?eyJ[\w-]*\.[\w-]+\.[\w-]+$/.test(value) ? 'jwt-shaped' : 'other-text';
          console.log('Open Quantum credential format:', format);
          JS
          node scripts/openquantum-readonly-smoke.mjs
