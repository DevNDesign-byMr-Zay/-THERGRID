name: release/github

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching package.json, for example v0.1.3"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require successful exact-SHA canonical live acceptance
        uses: actions/github-script@v8
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              ...context.repo,
              head_sha: context.sha,
              per_page: 100
            });
            const canonical = data.workflow_runs
              .filter(run =>
                run.name === 'aethergrid/canonical-live' &&
                run.path === '.github/workflows/aethergrid-canonical-live.yml' &&
                run.head_branch === 'main' &&
                run.head_sha === context.sha &&
                run.event === 'workflow_dispatch' &&
                run.status === 'completed' &&
                run.conclusion === 'success'
              )
              .sort((a, b) => b.id - a.id)[0];
            if (!canonical) {
              core.setFailed(`No successful exact-main aethergrid/canonical-live run exists for ${context.sha}`);
              return;
            }
            core.info(`Using canonical-live run #${canonical.run_number} (${canonical.id}) for ${context.sha}`);

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Normalize and validate requested tag
        id: release_tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          normalized="$(printf '%s' "$REQUESTED_TAG" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          if [ "$normalized" != "$expected" ]; then
            echo "Requested tag must equal $expected" >&2
            exit 1
          fi
          if git rev-parse "$normalized" >/dev/null 2>&1; then
            echo "Tag already exists: $normalized" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$normalized" >> "$GITHUB_OUTPUT"

      - name: Reproducible install
        run: npm ci --ignore-scripts

      - name: Verify deterministic release candidate
        run: |
          npm audit --audit-level=moderate
          npm run check
          docker compose config --quiet
          docker compose up --build --detach
          trap 'docker compose down --volumes --remove-orphans' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color
          exit 1

      - name: Build release evidence bundle
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          node scripts/create-release-manifest.mjs "${{ steps.release_tag.outputs.tag }}" "$GITHUB_SHA" release-manifest.json
          npm run package:aethergrid
          npm run package:aethergrid-app
          npm sbom --sbom-format=cyclonedx > sbom.cdx.json
          printf '%s\n' "$GITHUB_SHA" > release-commit.txt
          sha256sum sbom.cdx.json release-commit.txt release-manifest.json dist/aethergrid-functional-app.zip dist/aethergrid-operator-console.zip > release-artifacts.sha256

      - name: Verify release evidence checksums
        run: sha256sum --check release-artifacts.sha256

      - name: Retain release evidence before publication
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-${{ steps.release_tag.outputs.tag }}
          if-no-files-found: error
          retention-days: 30
          path: |
            sbom.cdx.json
            release-commit.txt
            release-manifest.json
            release-artifacts.sha256
            dist/aethergrid-functional-app.zip
            dist/aethergrid-operator-console.zip


      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release_tag.outputs.tag }}" \
            sbom.cdx.json release-commit.txt release-artifacts.sha256 release-manifest.json dist/aethergrid-functional-app.zip \
            --target "$GITHUB_SHA" \
            --title "${{ steps.release_tag.outputs.tag }}" \
            --generate-notes
