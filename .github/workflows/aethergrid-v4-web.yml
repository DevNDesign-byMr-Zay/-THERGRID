name: aethergrid/v4-web

on:
  pull_request:
    paths:
      - "apps/aethergrid-console/web/**"
      - "tests/aethergrid-v4-web-foundation.test.mjs"
      - ".github/workflows/aethergrid-v4-web.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-acceptance:
    name: web-acceptance (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [offline, operator, appearance, city-live-maps, temporal, tools, specialists, local-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/aethergrid-console/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install isolated web dependencies
        run: npm ci --ignore-scripts --include=optional --no-audit --no-fund

      - name: Type-check v4 spatial application
        run: npm run typecheck

      - name: Build v4 spatial application
        run: npm run build

      - name: Install root runtime dependencies for canonical preview
        working-directory: ${{ github.workspace }}
        run: npm ci --ignore-scripts

      - name: Install maintained Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and verify the direct-open local workspace without network access
        if: matrix.suite == 'offline'
        run: |
          npx vite build --config vite.local.config.ts
          node ../../../scripts/assemble-aethergrid-local-html.mjs
          npx playwright test --config playwright.local.config.ts --workers=1 --reporter=line

      - name: Verify authenticated operator sessions and recorded playback
        if: matrix.suite == 'operator'
        env:
          AETHERGRID_TEST_CANONICAL: "1"
        run: npx playwright test tests/session-history.spec.ts --workers=1 --reporter=line

      - name: Verify credential-free globe and 3D city mesh
        if: matrix.suite == 'operator'
        env:
          AETHERGRID_TEST_CANONICAL: "1"
        run: npx playwright test tests/tokenless-spatial.spec.ts --workers=1 --reporter=line

      - name: Verify compact navigation drawer focus and keyboard containment
        if: matrix.suite == 'operator'
        env:
          AETHERGRID_TEST_CANONICAL: "1"
        run: npx playwright test tests/command-center.spec.ts --grep "compact drawers contain focus and switch exclusively" --output=test-results/drawer-focus --workers=1 --reporter=line

      - name: Verify production shell, appearance and source truth
        if: matrix.suite == 'appearance'
        env:
          AETHERGRID_TEST_CANONICAL: "1"
        run: npx playwright test 'tests/production-.*\.spec\.ts' --output=test-results/production-shell --workers=1 --reporter=line

      - name: Verify source geometry and renderer fallback contracts
        if: matrix.suite == 'city-live-maps'
        env:
          AETHERGRID_TEST_CANONICAL: "1"
        run: npx playwright test tests/city-geometry.spec.ts tests/city-fidelity.spec.ts tests/live-maps.spec.ts --grep-invert compiled --output=test-results/city-contracts --workers=1 --reporter=line

      - name: Verify compiled city picking and native renderer fallback
        if: matrix.suite == 'city-live-maps'
        env:
          AETHERGRID_TEST_CANONICAL: "1"
        run: npx playwright test tests/city-geometry.spec.ts tests/live-map-browser.spec.ts --grep compiled --output=test-results/city-geometry --workers=1 --reporter=line

      - name: Verify source-valid timeline and unavailable history
        if: matrix.suite == 'temporal'
        env:
          AETHERGRID_TEST_CANONICAL: "1"
        run: npx playwright test tests/operational-timeline.spec.ts tests/forecast-frames.spec.ts tests/operational-timeline-browser.spec.ts --output=test-results/operational-timeline --workers=1 --reporter=line

      - name: Verify spatial presentations, modeled replay, area and scene contracts
        if: matrix.suite == 'temporal'
        env:
          AETHERGRID_TEST_CANONICAL: "1"
        run: npx playwright test tests/spatial-presentations.spec.ts tests/modeled-replay.spec.ts tests/spatial-area.spec.ts tests/spatial-scene.spec.ts tests/surface-picking.spec.ts tests/native-selection.spec.ts tests/renderer-transition.spec.ts tests/render-frame.spec.ts --output=test-results/spatial-contracts --workers=1 --reporter=line

      - name: Verify idle GPU rendering and camera input under reduced motion
        if: matrix.suite == 'temporal'
        env:
          AETHERGRID_TEST_CANONICAL: "1"
        run: npx playwright test tests/renderer-demand-browser.spec.ts --output=test-results/renderer-demand --workers=1 --reporter=line

      - name: Verify compiled spatial tools and source comparisons
        if: matrix.suite == 'tools'
        env:
          AETHERGRID_TEST_CANONICAL: "1"
        run: npx playwright test tests/spatial-tools-browser.spec.ts --output=test-results/spatial-tools --workers=1 --reporter=line

      - name: Verify specialist receipts, D-Wave hold and reduced-motion contracts
        if: matrix.suite == 'specialists'
        env:
          AETHERGRID_TEST_CANONICAL: "1"
        run: npx playwright test tests/specialist-integration.spec.ts tests/specialist-workflow.spec.ts tests/quantum-hold.spec.ts tests/weather-motion.spec.ts --output=test-results/specialist-contracts --workers=1 --reporter=line

      - name: Verify compiled specialists, operational pilot and responsive disclosures
        if: matrix.suite == 'specialists'
        env:
          AETHERGRID_TEST_CANONICAL: "1"
        run: npx playwright test tests/specialist-browser.spec.ts tests/specialist-workflow-browser.spec.ts tests/operational-pilot-browser.spec.ts tests/quantum-hold-browser.spec.ts tests/final-visual-browser.spec.ts --output=test-results/specialist-acceptance --workers=1 --reporter=line

      - name: Verify actual local TEAM runtime and offline recovery
        if: matrix.suite == 'local-runtime'
        env:
          AETHERGRID_TEST_CANONICAL: "1"
          AETHERGRID_AI_PROVIDER: "local"
        run: |
          npx playwright test tests/merged-runtime-browser.spec.ts --output=test-results/merged-runtime --workers=1 --reporter=line
          npx playwright test tests/command-center.spec.ts --grep "TEAM retains real|specialist conversations" --output=test-results/existing-runtime --workers=1 --reporter=line

      - name: Retain credential-free spatial screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aethergrid-spatial-preview-${{ github.sha }}-${{ matrix.suite }}
          path: |
            apps/aethergrid-console/web/test-results/credential-free-global.png
            apps/aethergrid-console/web/test-results/credential-free-new-york-3d.png
            apps/aethergrid-console/web/test-results/production-light-profile-*.png
            apps/aethergrid-console/web/test-results/production-shell/
            apps/aethergrid-console/web/test-results/geometry-contract-*.png
            apps/aethergrid-console/web/test-results/city-geometry/
            apps/aethergrid-console/web/test-results/operational-timeline/
            apps/aethergrid-console/web/test-results/timeline-*.png
            apps/aethergrid-console/web/test-results/spatial-tools/
            apps/aethergrid-console/web/test-results/spatial-*.png
            apps/aethergrid-console/web/test-results/specialist-acceptance/
            apps/aethergrid-console/web/test-results/specialist-*.png
            apps/aethergrid-console/web/test-results/step6-*.png
            apps/aethergrid-console/web/test-results/existing-runtime/
            apps/aethergrid-console/web/test-results/merged-runtime/
            apps/aethergrid-console/web/test-results/merged-runtime-*.png
            apps/aethergrid-console/web/test-results/operational-*.png
            apps/aethergrid-console/web/test-results/dwave-held-*.png
            apps/aethergrid-console/web/test-results/final-forecast-*.png
            apps/aethergrid-console/web/test-results/final-night-disclosure-*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Retain v4 spatial application bundle
        if: matrix.suite == 'city-live-maps'
        uses: actions/upload-artifact@v7
        with:
          name: aethergrid-v4-web-${{ github.sha }}
          path: apps/aethergrid-console/web/dist/
          if-no-files-found: error
          retention-days: 14

  web-build:
    name: web-build
    needs: web-acceptance
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser acceptance suite
        env:
          ACCEPTANCE_RESULT: ${{ needs.web-acceptance.result }}
        run: test "$ACCEPTANCE_RESULT" = success

  sustained-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/aethergrid-console/web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install isolated web dependencies
        run: npm ci --ignore-scripts --include=optional --no-audit --no-fund

      - name: Type-check and build the spatial application
        run: npm run typecheck && npm run build

      - name: Install root runtime dependencies for canonical preview
        working-directory: ${{ github.workspace }}
        run: npm ci --ignore-scripts

      - name: Install maintained Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify actual fifteen-minute modeled replay
        env:
          AETHERGRID_TEST_CANONICAL: "1"
          AETHERGRID_LONG_ACCEPTANCE: "1"
        run: |
          export AETHERGRID_TEST_CHROMIUM="$(node --input-type=module -e 'import { chromium } from "@playwright/test"; process.stdout.write(chromium.executablePath());')"
          npx playwright test tests/sustained-replay.spec.ts --output=test-results/sustained-replay --workers=1 --reporter=line

      - name: Retain replay measurements and actual scene screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aethergrid-sustained-replay-${{ github.sha }}
          path: apps/aethergrid-console/web/test-results/sustained-replay/
          if-no-files-found: warn
          retention-days: 14
