name: aethergrid/canonical-live

on:
  workflow_run:
    workflows: ['security/codeql']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      submission_sha:
        description: "Exact final main SHA with successful Engineering CI and CodeQL"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: aethergrid-canonical-live
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aethergrid-live-verification
    env:
      SUBMISSION_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.submission_sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout exact candidate main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Refuse mismatched or superseded main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUBMISSION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SUBMISSION_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SUBMISSION_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SUBMISSION_SHA"
      - name: Require exact-SHA engineering and security gates
        uses: actions/github-script@v8
        with:
          script: |
            const required = [['engineering/ci', '.github/workflows/ci.yml'], ['security/codeql', '.github/workflows/codeql.yml']];
            // CodeQL may finish before Engineering CI. Wait for the same SHA, never for another commit.
            for (let attempt = 0; attempt < 40; attempt += 1) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo, head_sha: process.env.SUBMISSION_SHA, per_page: 100
              });
              const pending = [];
              for (const [name, path] of required) {
                const run = data.workflow_runs
                  .filter(r => r.name === name && r.path === path && r.head_branch === 'main' && r.head_sha === process.env.SUBMISSION_SHA && r.event === 'push')
                  .sort((a, b) => b.id - a.id)[0];
                if (run?.status === 'completed' && run.conclusion !== 'success') {
                  core.setFailed(`${name} failed on this exact main SHA`);
                  return;
                }
                if (!run || run.status !== 'completed') pending.push(name);
              }
              if (pending.length === 0) return;
              if (attempt === 39) {
                core.setFailed(`Timed out waiting for exact-main checks: ${pending.join(', ')}`);
                return;
              }
              core.info(`Waiting for exact-main checks: ${pending.join(', ')}`);
              await new Promise(resolve => setTimeout(resolve, 15_000));
            }
      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked root dependencies
        run: npm ci --ignore-scripts
      - name: Validate maintained chain and canonical package
        run: npm run check
      - name: Preserve exact-candidate browser assets
        uses: actions/upload-artifact@v7
        with:
          name: canonical-browser-assets-${{ github.sha }}
          path: |
            apps/aethergrid-console/web/dist
            apps/aethergrid-console/web/local-dist
          if-no-files-found: error
          retention-days: 2
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aethergrid-live-verification
    strategy:
      fail-fast: false
      matrix:
        workload: ['1/4', '2/4', '3/4', '4/4', offline]
    env:
      SUBMISSION_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.submission_sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout exact candidate main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Refuse mismatched or superseded main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUBMISSION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SUBMISSION_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SUBMISSION_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SUBMISSION_SHA"
      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked root dependencies
        run: npm ci --ignore-scripts
      - name: Install locked web dependencies
        working-directory: apps/aethergrid-console/web
        run: npm ci
      - name: Restore exact-candidate browser assets
        uses: actions/download-artifact@v8
        with:
          name: canonical-browser-assets-${{ github.sha }}
          path: apps/aethergrid-console/web
      - name: Install browser from maintained Playwright package
        working-directory: apps/aethergrid-console/web
        run: npx playwright install --with-deps chromium
      - name: Canonical browser and responsive acceptance without credentials
        working-directory: apps/aethergrid-console/web
        env:
          AETHERGRID_TEST_CANONICAL: '1'
          WORKLOAD: ${{ matrix.workload }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WORKLOAD" == offline ]]; then
            npx playwright test --config playwright.canonical-offline.config.ts --workers=1
          else
            npx playwright test --config playwright.canonical.config.ts --shard="$WORKLOAD" --workers=1
          fi
      - name: Retain credential-free browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: canonical-browser-${{ strategy.job-index }}-${{ github.run_id }}
          path: apps/aethergrid-console/web/test-results
          if-no-files-found: warn
          retention-days: 30
  canonical-live:
    needs: [prepare, browser]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aethergrid-live-verification
    env:
      SUBMISSION_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.submission_sha || github.event.workflow_run.head_sha }}
    steps:
      - name: Checkout exact candidate main commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Refuse mismatched or superseded main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SUBMISSION_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SUBMISSION_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SUBMISSION_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$SUBMISSION_SHA"
      - name: Require every canonical browser workload
        id: browser_acceptance
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$BROWSER_RESULT" = success
      - name: Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install locked root dependencies
        run: npm ci --ignore-scripts
      - name: Install locked web dependencies
        working-directory: apps/aethergrid-console/web
        run: npm ci
      - name: Restore exact-candidate browser assets
        uses: actions/download-artifact@v8
        with:
          name: canonical-browser-assets-${{ github.sha }}
          path: apps/aethergrid-console/web
      - name: Install browser from maintained Playwright package
        working-directory: apps/aethergrid-console/web
        run: npx playwright install --with-deps chromium
      - name: Credentialed canonical API and Cesium acceptance
        id: credentialed_acceptance
        env:
          AETHERGRID_AI_PROVIDER: openai-compatible
          AETHERGRID_AI_MODEL: openai/gpt-oss-20b
          AETHERGRID_OPENAI_BASE_URL: https://api.groq.com/openai/v1
          AETHERGRID_OPENAI_API_KEY: ${{ secrets.AETHERGRID_OPENAI_API_KEY }}
          AETHERGRID_ENVIRONMENT_PROVIDER: tomorrow-io
          AETHERGRID_TOMORROW_IO_API_KEY: ${{ secrets.AETHERGRID_TOMORROW_IO_API_KEY }}
          AETHERGRID_EIA_API_KEY: ${{ secrets.AETHERGRID_EIA_API_KEY }}
          AETHERGRID_TRANSIT_API_KEY: ${{ secrets.AETHERGRID_TRANSIT_API_KEY }}
          AETHERGRID_TRANSIT_PROVIDER: transitland
          AETHERGRID_TRANSIT_BASE_URL: https://transit.land/api/v2/rest
          AETHERGRID_GTFS_FEEDS_FILE: ${{ github.workspace }}/docs/acceptance/aethergrid-command-center/verified-gtfs-feeds.json
          AETHERGRID_CESIUM_ION_TOKEN: ${{ secrets.AETHERGRID_CESIUM_ION_TOKEN }}
          AETHERGRID_IBM_QUANTUM_API_KEY: ${{ secrets.AETHERGRID_IBM_QUANTUM_API_KEY }}
          AETHERGRID_IBM_QUANTUM_SERVICE_CRN: ${{ secrets.AETHERGRID_IBM_QUANTUM_SERVICE_CRN }}
          AETHERGRID_DWAVE_API_TOKEN: ${{ secrets.AETHERGRID_DWAVE_API_TOKEN }}
          AETHERGRID_TEST_CANONICAL: '1'
          AETHERGRID_TEST_REQUIRE_CESIUM: '1'
        shell: bash
        run: |
          set +e
          node scripts/aethergrid-canonical-provider-smoke.mjs
          provider_status=$?
          (cd apps/aethergrid-console/web && npx playwright test tests/cesium-acceptance.spec.ts --workers=1 --reporter=line)
          cesium_status=$?
          node scripts/sanitize-canonical-artifacts.mjs
          sanitation_status=$?
          test "$provider_status" = 0 && test "$cesium_status" = 0 && test "$sanitation_status" = 0
      - name: Preserve truthful failure diagnostic when acceptance stops early
        if: failure()
        env:
          AETHERGRID_BROWSER_OUTCOME: ${{ steps.browser_acceptance.outcome }}
          AETHERGRID_PROVIDER_OUTCOME: ${{ steps.credentialed_acceptance.outcome }}
        run: node scripts/write-canonical-failure-evidence.mjs
      - name: Retain only sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aethergrid-canonical-live-${{ github.sha }}-${{ github.run_id }}
          path: canonical-evidence/*.json
          if-no-files-found: error
          retention-days: 30
