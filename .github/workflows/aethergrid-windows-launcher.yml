name: aethergrid/windows-launcher

on:
  pull_request:
    paths:
      - '.github/workflows/aethergrid-windows-launcher.yml'
      - 'apps/aethergrid-console/START-AETHERGRID.ps1'
      - 'apps/aethergrid-console/START-AETHERGRID.cmd'
      - 'apps/aethergrid-console/README.md'
      - 'tests/aethergrid-local-launcher.test.mjs'
      - 'apps/aethergrid-console/geo-runtime.mjs'
      - 'apps/aethergrid-console/web/src/renderer/overlays/**'
      - 'apps/aethergrid-console/web/src/renderer/cesium/network-overlay-layer.ts'
      - 'apps/aethergrid-console/web/src/renderer/cesium/cesium-renderer.ts'
      - 'apps/aethergrid-console/web/tests/local-file.spec.ts'
      - 'apps/aethergrid-console/web/src/services/city-power-overlay.ts'
      - 'apps/aethergrid-console/web/tests/city-fidelity.spec.ts'
      - 'tests/aethergrid-global-quantum-profile.test.mjs'
      - 'apps/aethergrid-console/web/src/services/city-tile-stream.ts'
      - 'apps/aethergrid-console/web/src/services/city-viewport-stream.ts'
      - 'apps/aethergrid-console/web/tests/city-viewport-stream.spec.ts'
      - 'apps/aethergrid-console/web/src/app/App.tsx'
      - 'apps/aethergrid-console/web/tests/city-tile-stream.spec.ts'
      - 'tests/aethergrid-camera-tiles-api.test.mjs'
      - 'apps/aethergrid-console/server.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-local-startup:
    name: windows-local-startup
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked runtime and compile canonical React application
        shell: powershell
        run: |
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { throw 'Root dependency install failed' }
          npm --prefix apps/aethergrid-console/web ci
          if ($LASTEXITCODE -ne 0) { throw 'Web dependency install failed' }
          npm --prefix apps/aethergrid-console/web run build
          if ($LASTEXITCODE -ne 0) { throw 'Canonical web build failed' }
          npm --prefix apps/aethergrid-console/web run test -- tests/city-tile-stream.spec.ts tests/city-viewport-stream.spec.ts
          if ($LASTEXITCODE -ne 0) { throw 'Camera tile stream regression tests failed' }
          node --test tests/aethergrid-camera-tiles-api.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Active operator city isolation test failed' }

      - name: Verify PowerShell 5.1 startup, port precedence and live health
        shell: powershell
        env:
          AETHERGRID_NO_BROWSER: '1'
          AETHERGRID_LAUNCH_DIAGNOSTICS: '1'
        run: |
          $ErrorActionPreference = "Stop"
          $Root = Join-Path (Get-Location).Path "apps/aethergrid-console"
          $EnvFile = Join-Path $Root ".env"
          $OverrideFile = Join-Path $Root ".env.aethergrid"
          $PidFile = Join-Path $Root ".aethergrid.pid"
          $Started = @()
          try {
            Set-Content $EnvFile "AETHERGRID_PORT=8091"
            Set-Content $OverrideFile "AETHERGRID_PORT=8092"

            foreach ($Case in @(
              @{ Port = 8092; InheritedPort = $null },
              @{ Port = 8093; InheritedPort = "8093" }
            )) {
              if ($Case.InheritedPort) {
                $env:AETHERGRID_PORT = $Case.InheritedPort
              } else {
                Remove-Item Env:AETHERGRID_PORT -ErrorAction SilentlyContinue
              }
              & powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $Root "START-AETHERGRID.ps1")
              if ($LASTEXITCODE -ne 0) { throw "Launcher failed for port $($Case.Port)" }
              $Response = Invoke-RestMethod -Uri "http://127.0.0.1:$($Case.Port)/api/aethergrid/health" -Method Get -TimeoutSec 5
              if ($Response.ok -ne $true -or $Response.product -ne (([char]0x00C6) + "THERGRID")) {
                throw "Wrong health response for port $($Case.Port)"
              }
              $StartedId = [int](Get-Content $PidFile)
              $Started += $StartedId
              Stop-Process -Id $StartedId -Force
              Start-Sleep -Milliseconds 300
              Remove-Item $PidFile -Force -ErrorAction SilentlyContinue
            }
          } finally {
            foreach ($StartedId in $Started) {
              Stop-Process -Id $StartedId -Force -ErrorAction SilentlyContinue
            }
            Remove-Item Env:AETHERGRID_PORT -ErrorAction SilentlyContinue
            Remove-Item $PidFile, $EnvFile, $OverrideFile -Force -ErrorAction SilentlyContinue
          }

      - name: Verify unprivileged portable Node fallback and secrets port precedence
        shell: powershell
        env:
          AETHERGRID_NO_BROWSER: '1'
        run: |
          $ErrorActionPreference = "Stop"
          $Root = Join-Path (Get-Location).Path "apps/aethergrid-console"
          $PortableDir = Join-Path $Root ".aethergrid-runtime"
          $PortableNode = Join-Path $PortableDir "node.exe"
          $Secrets = Join-Path $Root ".env.secrets"
          $PidFile = Join-Path $Root ".aethergrid.pid"
          $SavedPath = $env:Path
          $StartedId = 0
          try {
            New-Item -ItemType Directory -Force -Path $PortableDir | Out-Null
            Copy-Item -Path (Get-Command node).Source -Destination $PortableNode -Force
            Set-Content -Path $Secrets -Value "AETHERGRID_PORT=8094"
            # Hide installed Node from PATH to exercise the real portable startup.
            $env:Path = "$env:SystemRoot\System32;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
            & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File (Join-Path $Root "START-AETHERGRID.ps1")
            if ($LASTEXITCODE -ne 0) { throw "Portable launcher failed" }
            $Health = Invoke-RestMethod -Uri "http://127.0.0.1:8094/api/aethergrid/health" -TimeoutSec 5
            if ($Health.ok -ne $true -or $Health.product -ne (([char]0x00C6) + "THERGRID")) {
              throw "Portable runtime did not serve actual AETHERGRID health"
            }
            $StartedId = [int](Get-Content $PidFile)
          } finally {
            $env:Path = $SavedPath
            if ($StartedId -gt 0) { Stop-Process -Id $StartedId -Force -ErrorAction SilentlyContinue }
            Remove-Item $PidFile, $Secrets -Force -ErrorAction SilentlyContinue
            Remove-Item $PortableDir -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Verify source-backed city geometry on Windows
        shell: powershell
        run: |
          node --test tests/aethergrid-global-quantum-profile.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'OSM city source regression suite failed' }
          npm --prefix apps/aethergrid-console/web run test -- tests/city-fidelity.spec.ts
          if ($LASTEXITCODE -ne 0) { throw 'Real Cesium city geometry tests failed' }
