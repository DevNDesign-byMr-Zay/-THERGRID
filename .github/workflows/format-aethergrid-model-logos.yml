name: recovery/aethergrid-model-logo-format

on:
  push:
    branches:
      - brand/aethergrid-ai-model-logos

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out model-logo branch
        uses: actions/checkout@v7
        with:
          ref: brand/aethergrid-ai-model-logos
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Apply repository Prettier
        run: npm run format
      - name: Commit formatting only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/operator-console/app.js apps/operator-console/styles.css src/operator-console-server.mjs tests/operator-console-server.test.mjs scripts/verify-release-readiness.mjs docs/OPERATOR_CONSOLE.md
          git commit -m "style: format ÆTHERGRID AI model logo integration"
          git push origin "HEAD:brand/aethergrid-ai-model-logos"
