services:
  thergrid:
    build:
      context: .
    init: true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      THERGRID_PORT: "8080"
      THERGRID_LOG_LEVEL: "${THERGRID_LOG_LEVEL:-info}"
    ports:
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
