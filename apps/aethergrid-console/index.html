<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#030813" />
  <meta name="description" content="ÆTHERGRID operator intelligence console for digital twin, holographic, quantum, AI collaboration, and evidence review." />
  <title>ÆTHERGRID Operator Console</title>  <style>
:root{
  color-scheme:dark;
  --cyan:#23d7ff;
  --violet:#8d44ff;
  --blue:#2a72ff;
  --amber:#ffbb52;
  --green:#34ee84;
  --panel:rgba(2,10,25,.94);
  --line:rgba(87,154,255,.42);
  --text:#eff7ff;
  --muted:#95afd4;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#000;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{overflow:auto}
button,input{font:inherit}
.app-shell{min-width:980px;width:100%;min-height:100vh;background:#000}
.dashboard-stage{position:relative;width:100%;aspect-ratio:1536/1024;background:#020611;overflow:hidden;isolation:isolate}
.dashboard-reference{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none}
.hotspot-layer{position:absolute;inset:0;z-index:3}
.hotspot{position:absolute;left:calc(var(--x)*1%);top:calc(var(--y)*1%);width:calc(var(--w)*1%);height:calc(var(--h)*1%);border:0;border-radius:12px;background:transparent;cursor:pointer;outline:none;transition:background .18s ease,box-shadow .18s ease,transform .18s ease}
.hotspot:hover,.hotspot:focus-visible{background:rgba(31,213,255,.07);box-shadow:inset 0 0 0 1px rgba(70,226,255,.55),0 0 24px rgba(37,133,255,.24);transform:translateZ(0) scale(1.005)}
.hotspot:active{transform:scale(.995)}
.toast{position:fixed;right:24px;bottom:24px;z-index:20;width:min(430px,calc(100vw - 48px));padding:14px 16px;border:1px solid rgba(66,214,255,.4);border-radius:14px;background:linear-gradient(180deg,rgba(5,17,41,.98),rgba(2,8,22,.98));box-shadow:0 20px 60px rgba(0,0,0,.55),0 0 30px rgba(45,128,255,.18);opacity:0;transform:translateY(18px);pointer-events:none;transition:.25s ease;color:#dff6ff}
.toast.show{opacity:1;transform:none}
.toast b{display:block;margin-bottom:4px;color:#fff;letter-spacing:.04em}.toast small{color:var(--muted);line-height:1.5}
.glass-dialog{width:min(760px,calc(100vw - 40px));max-height:min(78vh,760px);overflow:auto;border:1px solid rgba(81,182,255,.45);border-radius:22px;padding:26px;background:radial-gradient(circle at 10% 0%,rgba(30,120,255,.18),transparent 34%),radial-gradient(circle at 90% 0%,rgba(160,61,255,.17),transparent 34%),rgba(2,10,25,.97);color:var(--text);box-shadow:0 30px 100px rgba(0,0,0,.7),0 0 50px rgba(62,116,255,.2);backdrop-filter:blur(26px)}
.glass-dialog::backdrop{background:rgba(0,4,12,.68);backdrop-filter:blur(7px)}
.dialog-close{position:sticky;float:right;top:0;width:38px;height:38px;border-radius:50%;border:1px solid rgba(113,168,255,.38);background:#07152d;color:#fff;font-size:24px;cursor:pointer}.dialog-kicker{color:var(--cyan);font-size:11px;font-weight:800;letter-spacing:.18em}.glass-dialog h2{margin:7px 50px 18px 0;font-size:26px}.dialog-body{display:grid;gap:14px}.detail-card{padding:16px;border:1px solid rgba(67,138,255,.3);border-radius:16px;background:linear-gradient(180deg,rgba(8,26,55,.82),rgba(4,13,31,.86))}.detail-card h3{margin:0 0 6px;font-size:16px}.detail-card p,.detail-card li{color:#a9bee0;line-height:1.55}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pill-row{display:flex;flex-wrap:wrap;gap:8px}.pill{padding:7px 10px;border:1px solid rgba(64,175,255,.38);border-radius:999px;color:#d7f7ff;background:rgba(10,53,94,.45);font-size:12px}.agent-detail{display:grid;grid-template-columns:72px 1fr;gap:18px;align-items:center}.agent-monogram{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;border:1px solid rgba(73,190,255,.5);background:radial-gradient(circle at 35% 30%,rgba(67,174,255,.32),rgba(62,36,142,.18) 55%,#030712 75%);box-shadow:0 0 32px rgba(56,136,255,.2);font-size:22px;font-weight:900;color:white}.chat-dialog{width:min(720px,calc(100vw - 40px))}.chat-log{display:grid;gap:12px;min-height:220px;max-height:45vh;overflow:auto;padding:8px 2px 16px}.chat-bubble{max-width:88%;padding:12px 14px;border-radius:16px;line-height:1.5}.chat-bubble.system{justify-self:start;background:rgba(28,91,160,.28);border:1px solid rgba(77,174,255,.25);color:#cfe6ff}.chat-bubble.user{justify-self:end;background:linear-gradient(135deg,rgba(68,95,255,.45),rgba(157,65,255,.4));border:1px solid rgba(145,106,255,.4)}.chat-form{display:grid;grid-template-columns:1fr auto;gap:10px}.chat-form input{min-width:0;padding:13px 15px;border-radius:13px;border:1px solid rgba(70,157,255,.45);outline:none;background:#06122a;color:#fff}.chat-form input:focus{border-color:#42d8ff;box-shadow:0 0 0 3px rgba(66,216,255,.09)}.chat-form button{border:1px solid rgba(83,173,255,.58);border-radius:13px;padding:0 18px;background:linear-gradient(135deg,#0f77ff,#8640ff);color:#fff;font-weight:700;cursor:pointer}
.progress-line{height:8px;border-radius:999px;background:#07142a;overflow:hidden;border:1px solid rgba(62,144,255,.28)}.progress-line>span{display:block;height:100%;background:linear-gradient(90deg,#21d7ff,#5f63ff,#d94cff);animation:load 1.1s ease both}@keyframes load{from{width:4%}to{width:var(--p,82%)}}
@media(max-width:1100px){.app-shell{min-width:1100px}.glass-dialog{position:fixed}.hotspot:hover{transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
/* Live interaction layer: intentionally subtle so the approved dashboard remains the idle visual baseline. */
.live-effects{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden}
.scanline{position:absolute;left:12.8%;top:11.5%;width:62.8%;height:43.5%;background:linear-gradient(180deg,transparent 0%,rgba(29,207,255,.055) 47%,rgba(66,101,255,.12) 50%,rgba(29,207,255,.035) 53%,transparent 100%);transform:translateY(-105%);animation:scan-field 8s linear infinite;mix-blend-mode:screen}
.grid-sheen{position:absolute;left:13.1%;top:11.8%;width:62.4%;height:43%;background:linear-gradient(112deg,transparent 0 38%,rgba(92,220,255,.08) 48%,rgba(173,76,255,.08) 52%,transparent 62%);transform:translateX(-80%);animation:sheen 11s ease-in-out infinite}
.pulse-node{position:absolute;width:7px;height:7px;border-radius:50%;background:#58e8ff;box-shadow:0 0 0 0 rgba(57,220,255,.35),0 0 14px rgba(61,183,255,.75);animation:pulse-node 2.8s ease-out infinite}
.pulse-node.violet{background:#bc70ff;box-shadow:0 0 0 0 rgba(170,80,255,.34),0 0 14px rgba(170,80,255,.75)}
.pulse-node.amber{background:#ffc56a;box-shadow:0 0 0 0 rgba(255,181,74,.34),0 0 14px rgba(255,181,74,.72)}
.selection-glow{position:absolute;display:none;border:1px solid rgba(89,227,255,.78);border-radius:12px;box-shadow:inset 0 0 22px rgba(31,169,255,.13),0 0 28px rgba(39,123,255,.24);background:linear-gradient(135deg,rgba(35,217,255,.045),rgba(143,67,255,.035));transition:left .28s ease,top .28s ease,width .28s ease,height .28s ease,opacity .2s ease;opacity:0}
.selection-glow.visible{display:block;opacity:1}
.activity-ripple{position:absolute;left:92.3%;top:2.25%;width:7px;height:7px;border-radius:50%;border:1px solid rgba(77,255,150,.75);box-shadow:0 0 12px rgba(77,255,150,.65);animation:status-pulse 2.2s ease-in-out infinite}
.telemetry-badge{position:absolute;right:1.45%;top:10.9%;display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:999px;border:1px solid rgba(49,198,255,.2);background:rgba(1,10,25,.46);color:#a9dfff;font-size:9px;letter-spacing:.1em;opacity:.0;transform:translateY(-5px);transition:.25s ease}
.dashboard-stage:hover .telemetry-badge{opacity:.82;transform:none}
.telemetry-badge i{width:5px;height:5px;border-radius:50%;background:#45f58b;box-shadow:0 0 8px rgba(69,245,139,.7)}
.hotspot.active-hit{background:rgba(31,213,255,.045);box-shadow:inset 0 0 0 1px rgba(78,211,255,.24)}
.hotspot[data-action^="agent-"].active-hit{box-shadow:inset 0 0 0 1px rgba(159,104,255,.35),0 0 18px rgba(120,61,255,.16)}
.hotspot[data-action="run-optimization"].busy{background:linear-gradient(90deg,rgba(44,100,255,.08),rgba(194,61,255,.13),rgba(44,100,255,.08));background-size:200% 100%;animation:busy-gradient 1.05s linear infinite}
.command-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.command-button,.region-button,.scenario-button{width:100%;text-align:left;padding:13px 14px;border:1px solid rgba(75,157,255,.3);border-radius:14px;background:linear-gradient(180deg,rgba(8,28,60,.75),rgba(4,14,33,.84));color:#eaf7ff;cursor:pointer;transition:.18s ease}
.command-button:hover,.region-button:hover,.scenario-button:hover{transform:translateY(-1px);border-color:rgba(82,215,255,.62);box-shadow:0 10px 30px rgba(0,0,0,.25),0 0 18px rgba(47,150,255,.11)}
.command-button b,.region-button b,.scenario-button b{display:block;margin-bottom:4px}.command-button small,.region-button small,.scenario-button small{color:#93afd6}
.metric-detail{display:grid;gap:12px}.metric-value{font-size:34px;font-weight:750;letter-spacing:-.035em}.metric-delta{color:#56ef90;font-weight:700}.mini-bars{height:74px;display:flex;align-items:end;gap:5px;padding:9px 0}.mini-bars i{flex:1;min-width:4px;height:var(--h);border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#47e8ff,#305fff 62%,#853eff);box-shadow:0 0 12px rgba(51,126,255,.15);transform-origin:bottom;animation:bars-in .65s cubic-bezier(.2,.8,.2,1) both}
.timeline{display:grid;gap:9px}.timeline-row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 12px;border:1px solid rgba(67,136,255,.24);border-radius:12px;background:rgba(5,17,39,.65)}.timeline-row i{width:8px;height:8px;border-radius:50%;background:#56e98e;box-shadow:0 0 10px rgba(86,233,142,.45)}.timeline-row small{color:#86a5d2}.timeline-row em{font-style:normal;font-size:10px;color:#63ef98;border:1px solid rgba(62,224,139,.3);border-radius:999px;padding:4px 7px}
.dialog-actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:4px}.dialog-actions button{border:1px solid rgba(83,173,255,.45);border-radius:11px;padding:9px 12px;background:rgba(13,42,84,.66);color:#eef8ff;cursor:pointer}.dialog-actions button.primary{background:linear-gradient(135deg,#167cfb,#7e41ff);border-color:rgba(115,181,255,.7)}
.live-log{max-height:190px;overflow:auto;display:grid;gap:7px;padding-right:3px}.log-line{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;line-height:1.5;color:#9dc4ef;padding:8px 10px;border-left:2px solid rgba(61,199,255,.4);background:rgba(4,19,42,.58)}
@keyframes scan-field{0%{transform:translateY(-105%)}100%{transform:translateY(130%)}}
@keyframes sheen{0%,16%{transform:translateX(-85%)}48%,100%{transform:translateX(115%)}}
@keyframes pulse-node{0%{transform:scale(.75);box-shadow:0 0 0 0 rgba(57,220,255,.34),0 0 12px currentColor}70%{transform:scale(1);box-shadow:0 0 0 13px rgba(57,220,255,0),0 0 18px currentColor}100%{transform:scale(.75);box-shadow:0 0 0 0 rgba(57,220,255,0),0 0 10px currentColor}}
@keyframes status-pulse{0%,100%{transform:scale(.85);opacity:.72}50%{transform:scale(1.35);opacity:1}}
@keyframes busy-gradient{to{background-position:-200% 0}}
@keyframes bars-in{from{transform:scaleY(.05);opacity:.15}to{transform:scaleY(1);opacity:1}}
@media(max-width:1100px){.command-grid{grid-template-columns:1fr}.telemetry-badge{display:none}}

  </style>
</head>

  let serverState = structuredClone(demoState);

  function escapeHtml(value = '') {
    return String(value).replace(/[&<>'"]/g, (character) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[character],

  }

  function showToast(title, copy) {
    if (!toast) return;
    toast.innerHTML = `<b>${escapeHtml(title)}</b><small>${escapeHtml(copy)}</small>`;

    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.classList.remove('show'), 3200);
  }

  async function api(path, options = {}) {
    if (location.protocol === 'file:') throw new Error('standalone mode');
    const response = await fetch(path, {
      ...options,
      headers: { 'content-type': 'application/json', ...(options.headers || {}) },
    });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const type = response.headers.get('content-type') || '';
    return type.includes('application/json') ? response.json() : response.text();
  }

  function mergeState(next) {
    serverState = {
      ...serverState,
      ...next,
      system: { ...serverState.system, ...(next?.system || {}) },
      metrics: { ...serverState.metrics, ...(next?.metrics || {}) },
      optimization: { ...serverState.optimization, ...(next?.optimization || {}) },
      agents: { ...serverState.agents, ...(next?.agents || {}) },
    };
  }

  async function loadState() {
    try {
      mergeState(await api('./api/aethergrid/state'));
    } catch {
      serverState = structuredClone(demoState);
    }
    updateTelemetryBadge();
  }

  function updateTelemetryBadge() {
    if (!telemetryBadge) return;
    telemetryBadge.innerHTML = `<i></i><span>${escapeHtml(
      serverState.system?.view || 'live',
    )} · ${Number(serverState.metrics?.loadMw || 2410).toLocaleString()} MW</span>`;
  }

  function nudgeStandaloneTelemetry() {
    if (location.protocol !== 'file:') return;
    const metrics = serverState.metrics;
    const tick = Math.sin(Date.now() / 8000);
    metrics.generationMw = Math.round(2130 + tick * 17);
    metrics.loadMw = Math.round(2410 + Math.cos(Date.now() / 9500) * 21);
    metrics.renewablePercent = Number((46.8 + Math.sin(Date.now() / 12000) * 1.2).toFixed(1));
    metrics.storageMw = Math.round(590 + Math.cos(Date.now() / 10000) * 9);
    updateTelemetryBadge();
  }

  function activateHotspot(button) {
    if (!button) return;
    if (activeHotspot) activeHotspot.classList.remove('active-hit');
    activeHotspot = button;
    button.classList.add('active-hit');
    if (!selectionGlow) return;
    for (const name of ['x', 'y', 'w', 'h']) {
      selectionGlow.style.setProperty(`--${name}`, button.style.getPropertyValue(`--${name}`));
    }
    selectionGlow.style.left = `calc(${button.style.getPropertyValue('--x')} * 1%)`;
    selectionGlow.style.top = `calc(${button.style.getPropertyValue('--y')} * 1%)`;
    selectionGlow.style.width = `calc(${button.style.getPropertyValue('--w')} * 1%)`;
    selectionGlow.style.height = `calc(${button.style.getPropertyValue('--h')} * 1%)`;
    selectionGlow.classList.add('visible');
  }

  function openPanel(kicker, title, html) {
    dialogKicker.textContent = kicker;
    dialogTitle.textContent = title;
    dialogBody.innerHTML = html;
    panelDialog.showModal();
  }

  function bars(seed = 0) {
    return Array.from({ length: 18 }, (_, index) => {
      const height = 25 + ((index * 17 + seed * 11) % 64);
      return `<i style="--h:${height}%"></i>`;
    }).join('');
  }

  function timeline(items = serverState.evidence || demoState.evidence) {
    return `<div class="timeline">${items
      .map(
        (item) => `
          <div class="timeline-row">
            <i></i>
            <span><b>${escapeHtml(item.title)}</b><small>${escapeHtml(item.age || 'recent')}</small></span>
            <em>${escapeHtml(item.status || 'VERIFIED')}</em>
          </div>`,
      )
      .join('')}</div>`;
  }

  function overviewPanel() {
    const metrics = serverState.metrics || demoState.metrics;
    return `
      <div class="detail-grid">
        <div class="detail-card">
          <h3>System status</h3>
          <p>${escapeHtml(serverState.system?.status || 'All Systems Nominal')}</p>
          <span class="pill">ADVISORY ONLY</span>
        </div>
        <div class="detail-card">
          <h3>Region</h3>
          <p>${escapeHtml(serverState.system?.region || 'New York Metro')} digital-twin review surface.</p>
          <span class="pill">${escapeHtml((serverState.system?.view || 'live').toUpperCase())} VIEW</span>
        </div>
      </div>
      <div class="detail-card">
        <h3>System metrics</h3>
        <div class="pill-row">
          <span class="pill">${Number(metrics.generationMw).toLocaleString()} MW generation</span>
          <span class="pill">${Number(metrics.loadMw).toLocaleString()} MW load</span>
          <span class="pill">${metrics.renewablePercent}% renewable</span>

        </div>
      </div>
      <div class="detail-card">
        <h3>Live activity</h3>
        <div class="live-log" id="liveLog">
          ${(serverState.activity || [])
            .slice(0, 6)
            .map((entry) => `<div class="log-line">${escapeHtml(entry.message || entry)}</div>`)
            .join('') || '<div class="log-line">Operator console synchronized. Awaiting next event.</div>'}
        </div>
      </div>
    `;
  }

  function metricPanel(action) {
    const metrics = serverState.metrics || demoState.metrics;
    const map = {
      'metric-generation': ['TOTAL GENERATION', metrics.generationMw, 'MW', '+12.4%', 3],
      'metric-load': ['TOTAL LOAD', metrics.loadMw, 'MW', '+8.1%', 6],
      'metric-renewable': ['RENEWABLE %', metrics.renewablePercent, '%', '+6.3%', 9],
      'metric-storage': ['STORAGE AVAILABLE', metrics.storageMw, 'MW', '+18.6%', 12],
    };
    const [title, value, unit, delta, seed] = map[action];
    return `
      <div class="detail-card metric-detail">
        <h3>${title}</h3>
        <div class="metric-value">${Number(value).toLocaleString()} <small>${unit}</small></div>
        <div class="metric-delta">↑ ${delta}</div>
        <div class="mini-bars">${bars(seed)}</div>
        <p>Telemetry is presented for operator review only. This surface does not authorize physical grid actuation.</p>
      </div>
    `;
  }

    const optimization = serverState.optimization || demoState.optimization;
    if (action?.startsWith('metric-')) {
      return ['SYSTEM METRICS', action.replace('metric-', '').toUpperCase(), metricPanel(action)];
    }

    const sections = {
      overview: ['SYSTEM OVERVIEW', 'New York Metro Operator View', overviewPanel()],
      grid: [
        'DIGITAL TWIN',
        'Grid & Assets',
        `
          <div class="detail-card">
            <h3>${escapeHtml(serverState.system?.region || 'New York Metro')} live field</h3>
            <p>The approved ÆTHERGRID control-room canvas is the visual baseline. The live application layer tracks review mode, region, scenarios, evidence, AI collaboration, and bounded optimization without changing the system authority boundary.</p>

              <span class="pill">Grid Operator</span><span class="pill">Weather & Climate</span>

            <button data-inline-action="forecast">Forecast</button>
            <button data-inline-action="scenario-view">Scenario</button>
            <button data-inline-action="search">Search assets</button>
          </div>
        `,
      ],
      holographic: [
        'HOLOGRAPHIC',
        '3D Spatial Analysis',
        `
          <div class="detail-card">
            <h3>Layered spatial visualization</h3>
            <p>Infrastructure, energy flow, risk zones, and future-state evidence remain renderer-neutral and reviewable.</p>
            <div class="progress-line"><span style="--p:92%"></span></div>
          </div>

            <div class="detail-card"><h3>Candidate solution</h3><p>$${Number(optimization.candidateCost).toLocaleString()} / hr</p></div>

          <div class="detail-card">
            <h3>Evidence-bound improvement</h3>
            <div class="pill-row">
              <span class="pill">${optimization.emissionsReduction}% emissions reduction</span>

      ],
      ai: [
        'AI COLLABORATION',
        'Specialized Intelligence. Better Decisions.',
        Object.entries(serverState.agents || demoState.agents)
          .map(
            ([name, agent]) => `
              <button class="command-button" data-inline-action="agent:${escapeHtml(name)}">

  function openSearch() {

    serverState.system.view = view;
    try {
      const result = await api('./api/aethergrid/view', {
        method: 'POST',
        body: JSON.stringify({ view }),
      });
      mergeState(result.state || result);
    } catch {}
    updateTelemetryBadge();
    showToast(`${view.toUpperCase()} VIEW`, `${serverState.system.region} switched to ${view} review mode.`);
  }

  async function setRegion(region) {
    serverState.system.region = region;
    try {
      const result = await api('./api/aethergrid/region', {
        method: 'POST',
        body: JSON.stringify({ region }),
      });
      mergeState(result.state || result);
    } catch {}
    updateTelemetryBadge();
    panelDialog.close();
    showToast('REGION CHANGED', `${region} is now the active operator review region.`);
  }

  async function setScenario(scenario) {
    serverState.system.scenario = scenario;
    try {
      const result = await api('./api/aethergrid/scenario', {
        method: 'POST',
        body: JSON.stringify({ scenario }),
      });
      mergeState(result.state || result);
    } catch {}
    showToast('SCENARIO LOADED', `${scenario.replaceAll('-', ' ')} is active for review.`);
    const [kicker, title, html] = panelFor('scenarios');
    openPanel(kicker, title, html);
  }

  async function runOptimization(button = null) {
    if (button) button.classList.add('busy');
    showToast('QUANTUM OPTIMIZATION', 'Starting bounded multi-objective scenario evaluation…');
    try {
      const result = await api('./api/aethergrid/optimize', {
        method: 'POST',
        body: JSON.stringify({
          objective: 'minimize_cost_emissions',
          scenario: serverState.system?.scenario,
          region: serverState.system?.region,
        }),
      });
      mergeState({ optimization: result.optimization, activity: result.activity });
    } catch {
      serverState.optimization.runCount = Number(serverState.optimization.runCount || 0) + 1;
      serverState.optimization.candidateCost = Math.max(
        9800,
        Number(serverState.optimization.candidateCost || 10230) - 35,
      );
      serverState.optimization.emissionsReduction = Number(
        (Number(serverState.optimization.emissionsReduction || 24.3) + 0.4).toFixed(1),
      );
    } finally {
      if (button) setTimeout(() => button.classList.remove('busy'), 700);
    }
    setTimeout(
      () =>
        showToast(
          'OPTIMIZATION COMPLETE',
          `Candidate $${Number(serverState.optimization.candidateCost).toLocaleString()}/hr · classical comparison preserved.`,
        ),
      650,
    );
  }

  async function exportEvidence(kind) {
    const payload = {
      kind,
      generatedAt: new Date().toISOString(),
      system: serverState.system,
      metrics: serverState.metrics,
      optimization: serverState.optimization,
      evidence: serverState.evidence,
      advisoryOnly: true,
    };
    try {
      const result = await api('./api/aethergrid/export', {
        method: 'POST',
        body: JSON.stringify(payload),
      });
      payload.serverReceipt = result.receipt;
    } catch {}
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement('a');
    anchor.href = url;
    anchor.download = `aethergrid-${kind}-${Date.now()}.json`;
    anchor.click();
    setTimeout(() => URL.revokeObjectURL(url), 500);
    showToast('EXPORT READY', `${kind.replaceAll('-', ' ')} generated with evidence metadata.`);
  }

  function openAgent(name) {

          <button data-inline-action="evidence">View evidence</button>
        </div>
      `,
    );
  }

    serverState.system.scenario = 'peak-demand';
    try {
      const result = await api('./api/aethergrid/reset', { method: 'POST', body: '{}' });
      mergeState(result.state || result);
    } catch {}
    panelDialog.close();
    updateTelemetryBadge();
    showToast('VIEW RESET', 'Operator review state returned to the New York Metro live baseline.');
  }

  function handleAction(action, button = null) {
    if (!action) return;
    if (button) activateHotspot(button);
    if (action === 'run-optimization') return runOptimization(button);
    if (action === 'compare-classical')
      return showToast('CLASSICAL COMPARISON', 'Baseline comparison opened for evidence review.');
    if (action === 'search') return openSearch();
    if (action === 'change-region') return openRegions();
    if (action === 'ai-chat') {
      chatDialog.showModal();
      chatInput.focus();
      return;
    }
    if (action === 'health-check') return healthCheck();
    if (action === 'reset-view') return resetView();
    if (action.startsWith('agent-')) {
      const names = {
        'agent-vaelon': 'VÆLON',
        'agent-auren': 'AUREN',
        'agent-solvaer': 'SOLVÆR',
      };
      return openAgent(names[action]);
    }
    if (action.startsWith('export-')) return exportEvidence(action.replace('export-', ''));
    if (['live', 'forecast', 'scenario-view'].includes(action)) {
      return setView(action === 'scenario-view' ? 'scenario' : action);
    }
    if (action.startsWith('map-')) {
      return showToast('SPATIAL CONTROL', `${action.replace('map-', '').replaceAll('-', ' ')} control engaged in read-only review mode.`);
    }
    if (action.startsWith('holo-')) {
      return showToast('HOLOGRAPHIC LAYER', `${action.replace('holo-', '').replaceAll('-', ' ')} layer selected.`);
    }
    const [kicker, title, html] = panelFor(action);
    openPanel(kicker, title, html);
  }

  qa('[data-dialog-close]').forEach((button) =>
    button.addEventListener('click', () => button.closest('dialog').close()),
  );

  qa('.hotspot').forEach((button) =>
    button.addEventListener('click', () => handleAction(button.dataset.action, button)),
  );

  dialogBody.addEventListener('click', (event) => {
    const target = event.target.closest('[data-inline-action],[data-region],[data-scenario],[data-search-action]');
    if (!target) return;
    if (target.dataset.region) return setRegion(target.dataset.region);
    if (target.dataset.scenario) return setScenario(target.dataset.scenario);
    if (target.dataset.searchAction) {
      const mapping = { grid: 'grid', renewable: 'metric-renewable', storage: 'metric-storage', scenario: 'scenarios' };
      const [kicker, title, html] = panelFor(mapping[target.dataset.searchAction] || 'overview');
      return openPanel(kicker, title, html);
    }
    const action = target.dataset.inlineAction;
    if (action?.startsWith('agent:')) return openAgent(action.slice('agent:'.length));
    return handleAction(action, target);
  });

  dialogBody.addEventListener('input', (event) => {
    if (event.target.id !== 'commandSearchInput') return;
    const needle = event.target.value.trim().toLowerCase();
    qa('#commandResults .command-button').forEach((button) => {
      button.hidden = needle && !button.textContent.toLowerCase().includes(needle);
    });
  });

  chatForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const message = chatInput.value.trim();
    if (!message) return;
    chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble user">${escapeHtml(message)}</div>`);
    chatInput.value = '';
    let reply =
      'VÆLON, AUREN, and SOLVÆR reviewed the request. This interface is advisory-only; recommendations remain evidence-bound and require operator review.';
    try {
      const result = await api('./api/aethergrid/chat', {
        method: 'POST',
        body: JSON.stringify({
          message,
          region: serverState.system?.region,
          scenario: serverState.system?.scenario,
        }),
      });
      reply = result.reply || reply;
      if (result.activity) serverState.activity = result.activity;
    } catch {}
    chatLog.insertAdjacentHTML('beforeend', `<div class="chat-bubble system">${escapeHtml(reply)}</div>`);
    chatLog.scrollTop = chatLog.scrollHeight;
  });

  function initEffects() {
    if (telemetryTimer) clearInterval(telemetryTimer);
    telemetryTimer = setInterval(nudgeStandaloneTelemetry, 2600);
    const first = q('.hotspot[data-action="overview"]');
    if (first) activateHotspot(first);
  }

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }

  loadState();
  initEffects();
})();
  </script>
</body>
</html>
