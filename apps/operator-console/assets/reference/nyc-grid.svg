<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">New York Metro digital twin field</title>
  <desc id="desc">Stylized night-time metro energy network with Manhattan skyline, renewable generation, storage and transmission corridors.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06152d"/>
      <stop offset=".48" stop-color="#07172b"/>
      <stop offset="1" stop-color="#020812"/>
    </linearGradient>
    <radialGradient id="cityGlow" cx=".55" cy=".45" r=".52">
      <stop offset="0" stop-color="#164c99" stop-opacity=".52"/>
      <stop offset=".5" stop-color="#0a2450" stop-opacity=".18"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061e37"/>
      <stop offset=".45" stop-color="#03111f"/>
      <stop offset="1" stop-color="#07152a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18dfff"/>
      <stop offset=".45" stop-color="#ffbd4c"/>
      <stop offset="1" stop-color="#b650ff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#1d5a85" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="540" fill="url(#sky)"/>
  <rect width="1200" height="540" fill="url(#cityGlow)"/>
  <circle cx="900" cy="85" r="130" fill="#6a27ff" opacity=".08"/>
  <circle cx="1030" cy="180" r="190" fill="#00c8ff" opacity=".05"/>
