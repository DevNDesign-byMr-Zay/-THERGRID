  <path d="M0 350 C170 310 280 365 410 330 S665 278 820 315 1058 370 1200 328" fill="none" stroke="#1f6aa0" stroke-opacity=".22" stroke-width="2"/>
  <path d="M0 394 C170 352 293 407 450 371 S744 319 920 361 1080 399 1200 382" fill="none" stroke="#2b74a4" stroke-opacity=".13"/>
